name: historical-backfill

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['backfill.py']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Backfill 2 years of prices
        run: python backfill.py

      - name: Compute historical outcomes
        run: python outcomes.py

      - name: Rebuild dashboard + backtest report
        run: python build_site.py

      - name: Commit history + outcomes
        run: |
          git config user.name "unlock-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add data/ docs/
          git commit -m "Historical backfill" || echo "No changes"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
